
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeze Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f4f6ff;font-family:Arial,sans-serif}
header{padding:22px 18px;background:#121a30;border-bottom:1px solid #293550}
.wrap{max-width:1050px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:27px;font-weight:bold;color:#8b9cff}
.sub,.muted{color:#9ba8c5;font-size:13px}
button{background:#647cff;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:bold}
button:disabled{opacity:.5;cursor:wait}
input{width:100%;padding:12px;margin:8px 0;background:#151f36;border:1px solid #34415e;border-radius:9px;color:white}
.panel{background:#121a30;border:1px solid #293550;padding:18px;border-radius:15px;margin:20px 0}
h2{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px;margin-top:18px}
.file{background:#151f36;border:1px solid #293550;border-radius:13px;overflow:hidden;min-width:0}
.preview{height:145px;background:#0b1020;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}
.fileinfo{padding:12px}
.filename{font-size:14px;word-break:break-word;margin-bottom:10px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions a,.actions button{font-size:12px;text-decoration:none;padding:9px;border:0;border-radius:8px}
.actions a{background:#26385f;color:white}
.danger{background:#a63b50}
.hidden{display:none!important}
#status{font-size:13px;color:#aab8d7;margin-top:12px}
footer{text-align:center;padding:30px;color:#7886a5;font-size:12px}
@media(max-width:480px){
 .logo{font-size:22px}
 .wrap{padding:14px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .preview{height:120px}
}
</style>
</head>
<body>

<header>
 <div class="wrap top">
  <div>
   <div class="logo">☁ ZEZE CLOUD</div>
   <div class="sub">Your personal file sharing space</div>
  </div>
  <button id="loginBtn" onclick="showLogin()">Admin Login</button>
 </div>
</header>

<main class="wrap">

 <div class="panel">
  <h2>Selamat datang di Zeze Cloud</h2>
  <p class="muted">Simpan, tonton, dan download file dengan mudah.</p>
  <input id="search" placeholder="🔍 Cari nama file..." oninput="renderFiles()">
 </div>

 <div class="panel hidden" id="loginPanel">
  <h2>Admin Login</h2>
  <input id="email" type="email" placeholder="Email admin">
  <input id="password" type="password" placeholder="Password admin">
  <button id="loginAction" onclick="login()">Masuk</button>
  <button onclick="hideLogin()" style="background:#35415a">Batal</button>
  <p id="loginStatus" class="muted"></p>
 </div>

 <div class="panel hidden" id="adminPanel">
  <div class="top">
   <h2>Admin Dashboard</h2>
   <button onclick="logout()" class="danger">Logout</button>
  </div>
  <p class="muted">Upload file baru ke Zeze Cloud.</p>
  <input type="file" id="fileInput" multiple>
  <button id="uploadBtn" onclick="uploadFiles()">⬆ Upload File</button>
  <p id="uploadStatus" class="muted"></p>
 </div>

 <div class="top">
  <h2>📁 Semua File</h2>
  <button onclick="loadFiles()" style="background:#35415a">↻ Refresh</button>
 </div>
 <p class="muted" id="count">Memuat file...</p>
 <div id="files" class="grid"></div>
 <p id="status"></p>

</main>

<footer>© 2026 Zeze Cloud · Your personal cloud storage</footer>

<script>
// KONFIGURASI SUPABASE
const SUPABASE_URL = "https://sgcrivgrlxeqkryreabc.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ve4X8ArfrWWj5hvCvB4raw_fIcdid3o";
const BUCKET = "zeze-cloud";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let isAdmin = false;
let allFiles = [];

function showLogin(){
 document.getElementById("loginPanel").classList.remove("hidden");
}
function hideLogin(){
 document.getElementById("loginPanel").classList.add("hidden");
}

function updateAdminUI(){
 document.getElementById("adminPanel").classList.toggle("hidden",!isAdmin);
 document.getElementById("loginBtn").classList.toggle("hidden",isAdmin);
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const status=document.getElementById("loginStatus");
 const btn=document.getElementById("loginAction");

 if(!email||!password){
  status.textContent="Masukkan email dan password.";
  return;
 }

 btn.disabled=true;
 status.textContent="Sedang masuk...";

 const {error}=await db.auth.signInWithPassword({email,password});

 btn.disabled=false;

 if(error){
  status.textContent="Login gagal: "+error.message;
  return;
 }

 document.getElementById("password").value="";
 hideLogin();
 await checkAdmin();
}

async function logout(){
 const {error}=await db.auth.signOut();
 if(error){alert(error.message);return;}
 isAdmin=false;
 updateAdminUI();
 await loadFiles();
}

async function checkAdmin(){
 const {data,error}=await db.auth.getSession();
 if(error){
  document.getElementById("status").textContent=error.message;
  return;
 }
 isAdmin=!!data.session;
 updateAdminUI();
 await loadFiles();
}

async function loadFiles(){
 const status=document.getElementById("status");
 const container=document.getElementById("files");

 status.textContent="Memuat file...";
 container.innerHTML="";

 const {data,error}=await db.storage.from(BUCKET).list("",{
  limit:1000,
  sortBy:{column:"created_at",order:"desc"}
 });

 if(error){
  status.textContent="Gagal memuat file: "+error.message;
  document.getElementById("count").textContent="File tidak tersedia";
  return;
 }

 allFiles=(data||[]).filter(f=>f.name&&!f.name.startsWith("."));
 status.textContent="";
 renderFiles();
}

function renderFiles(){
 const query=document.getElementById("search").value.toLowerCase();
 const container=document.getElementById("files");

 container.innerHTML="";

 const filtered=allFiles.filter(f=>f.name.toLowerCase().includes(query));

 document.getElementById("count").textContent=filtered.length+" file tersedia";

 if(!filtered.length){
  container.innerHTML='<p class="muted">Belum ada file ditemukan.</p>';
  return;
 }

 filtered.forEach(f=>{
  const path=f.name;
  const ext=path.split(".").pop().toLowerCase();

  const isImage=["jpg","jpeg","png","gif","webp","avif"].includes(ext);
  const isVideo=["mp4","webm","mov","m4v"].includes(ext);

  const {data}=db.storage.from(BUCKET).getPublicUrl(path);
  const url=data.publicUrl;

  const {data:downloadData}=db.storage.from(BUCKET).getPublicUrl(path,{
   download:true
  });
  const downloadUrl=downloadData.publicUrl;

  const card=document.createElement("div");
  card.className="file";

  const preview=document.createElement("div");
  preview.className="preview";

  if(isImage){
   const img=document.createElement("img");
   img.src=url;
   img.loading="lazy";
   img.alt=path;
   preview.appendChild(img);
  }else if(isVideo){
   const video=document.createElement("video");
   video.src=url;
   video.controls=true;
   video.preload="metadata";
   preview.appendChild(video);
  }else{
   const icon=document.createElement("span");
   icon.textContent="📄";
   icon.style.fontSize="45px";
   preview.appendChild(icon);
  }

  const info=document.createElement("div");
  info.className="fileinfo";

  const name=document.createElement("div");
  name.className="filename";
  name.textContent=path;

  const actions=document.createElement("div");
  actions.className="actions";

  const open=document.createElement("a");
  open.href=url;
  open.target="_blank";
  open.rel="noopener";
  open.textContent=isVideo?"Tonton":isImage?"Lihat":"Buka";

  const download=document.createElement("a");
  download.href=downloadUrl;
  download.textContent="Download";

  actions.appendChild(open);
  actions.appendChild(download);

  if(isAdmin){
   const del=document.createElement("button");
   del.className="danger";
   del.textContent="Hapus";
   del.onclick=()=>deleteFile(path);
   actions.appendChild(del);
  }

  info.appendChild(name);
  info.appendChild(actions);
  card.appendChild(preview);
  card.appendChild(info);
  container.appendChild(card);
 });
}

async function uploadFiles(){
 const input=document.getElementById("fileInput");
 const status=document.getElementById("uploadStatus");
 const btn=document.getElementById("uploadBtn");
 const files=Array.from(input.files);

 if(!isAdmin){
  status.textContent="Silakan login sebagai admin.";
  return;
 }

 if(!files.length){
  status.textContent="Pilih file terlebih dahulu.";
  return;
 }

 btn.disabled=true;

 for(let i=0;i<files.length;i++){
  const file=files[i];
  const safeName=file.name.replace(/[^\w.\-() ]/g,"_");
  const path=Date.now()+"-"+i+"-"+safeName;

  status.textContent=`Mengupload ${i+1} dari ${files.length} file...`;

  const {error}=await db.storage.from(BUCKET).upload(path,file,{
   cacheControl:"3600",
   upsert:false
  });

  if(error){
   status.textContent="Upload gagal: "+error.message;
   btn.disabled=false;
   return;
  }
 }

 input.value="";
 btn.disabled=false;
 status.textContent="Semua file berhasil diupload!";
 await loadFiles();
}

async function deleteFile(path){
 if(!isAdmin)return;

 const confirmDelete=confirm("Yakin ingin menghapus "+path+"?");
 if(!confirmDelete)return;

 const {error}=await db.storage.from(BUCKET).remove([path]);

 if(error){
  alert("Gagal menghapus: "+error.message);
  return;
 }

 alert("File berhasil dihapus.");
 await loadFiles();
}

db.auth.onAuthStateChange((event,session)=>{
 isAdmin=!!session;
 updateAdminUI();
 if(event==="SIGNED_IN"||event==="SIGNED_OUT"){
  setTimeout(()=>loadFiles(),0);
 }
});

checkAdmin();
</script>

</body>
</html>
